<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments – Demo Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-mark">B</span> BookEasy SA
      </a>
      <nav class="nav">
        <a href="../kujas-nails.html">Public booking page</a>
      </nav>
    </div>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="index.html">Overview</a>
        <a href="appointments.html" class="active">Appointments</a>
        <a href="services.html">Services & prices</a>
        <a href="finances.html">Income & expenses</a>
        <a href="../index.html">← Back to site</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Appointments</h1>
      </div>

      <div class="demo-note">
        All entries are fictional or created during this browser session. Status changes are saved only in localStorage.
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Service</th>
              <th>Date & time</th>
              <th>Phone</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appt-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    function render() {
      const appointments = DemoStore.get("appointments", []);
      const tbody = document.getElementById("appt-body");
      tbody.innerHTML = "";

      if (appointments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--gray-500);padding:2rem;">No appointments yet. Try the public booking page.</td></tr>';
        return;
      }

      appointments.forEach((a, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${a.customer}</td>
          <td>${a.service}</td>
          <td>${a.date} · ${a.time}</td>
          <td>${a.phone || "—"}</td>
          <td><span class="status status-${a.status}">${a.status}</span></td>
          <td style="display:flex;gap:0.3rem;flex-wrap:wrap;">
            ${a.status === "pending" ? `<button type="button" class="btn btn-success btn-sm" data-action="confirm" data-idx="${idx}">Confirm</button>` : ""}
            ${a.status !== "cancelled" ? `<button type="button" class="btn btn-danger btn-sm" data-action="cancel" data-idx="${idx}">Cancel</button>` : ""}
          </td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          const list = DemoStore.get("appointments", []);
          const i = Number(btn.dataset.idx);
          if (btn.dataset.action === "confirm") list[i].status = "confirmed";
          if (btn.dataset.action === "cancel") list[i].status = "cancelled";
          DemoStore.set("appointments", list);
          render();
        });
      });
    }
    render();
  </script>
</body>
</html>
