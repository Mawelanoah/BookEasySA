<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Kuja’s Nails (Demo)</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/mobile-fix.css" />
  <style>
    .appt-cards { display: flex; flex-direction: column; gap: 0.75rem; }
    .appt-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: var(--shadow);
    }
    .appt-card .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
    }
    .appt-card .name { font-weight: 700; font-size: 1rem; word-break: break-word; }
    .appt-card .meta { font-size: 0.88rem; color: var(--gray-500); line-height: 1.45; }
    .appt-card .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .appt-card .actions .btn { flex: 1 1 auto; min-width: 0; }
    .desk-table { display: none; }
    @media (min-width: 768px) {
      .appt-cards { display: none; }
      .desk-table { display: block; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="#5125A8"/><rect x="8" y="10" width="24" height="20" rx="3" fill="white" fill-opacity="0.95"/><rect x="8" y="10" width="24" height="6" rx="2" fill="#32145F"/><path d="M15 24.5l3.2 3.2 6.8-7" stroke="#5125A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="logo-text">BookEasy <span>SA</span></span>
      </a>
      <nav class="nav">
        <a href="../kujas-nails.html" class="btn btn-outline btn-sm">Public page</a>
      </nav>
    </div>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="index.html" class="active">Overview</a>
        <a href="appointments.html">Appointments</a>
        <a href="services.html">Services</a>
        <a href="finances.html">Finances</a>
        <a href="../index.html">← Site</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Dashboard</h1>
          <p style="color:var(--gray-500);margin:0;font-size:0.88rem;">Kuja’s Nails · Demo data</p>
        </div>
      </div>

      <div class="demo-note">
        Demo only — not a real login. Data stays in this browser.
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">Today</div>
          <div class="value" id="stat-today">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending</div>
          <div class="value" id="stat-pending">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Confirmed</div>
          <div class="value" id="stat-confirmed">—</div>
        </div>
        <div class="stat-card">
          <div class="label">Services</div>
          <div class="value" id="stat-services">—</div>
        </div>
      </div>

      <h2 style="font-size:1.05rem;margin-bottom:0.75rem;">Recent appointments</h2>

      <!-- Mobile cards -->
      <div class="appt-cards" id="recent-cards"></div>

      <!-- Desktop table -->
      <div class="table-wrap desk-table">
        <table>
          <thead>
            <tr><th>Customer</th><th>Service</th><th>When</th><th>Status</th></tr>
          </thead>
          <tbody id="recent-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    const appointments = DemoStore.get("appointments", []);
    const services = DemoStore.get("services", []);
    const today = todayISO();

    document.getElementById("stat-today").textContent =
      appointments.filter(function (a) { return a.date === today && a.status !== "cancelled"; }).length;
    document.getElementById("stat-pending").textContent =
      appointments.filter(function (a) { return a.status === "pending"; }).length;
    document.getElementById("stat-confirmed").textContent =
      appointments.filter(function (a) { return a.status === "confirmed"; }).length;
    document.getElementById("stat-services").textContent = services.length;

    var list = appointments.slice(0, 6);
    var cards = document.getElementById("recent-cards");
    var tbody = document.getElementById("recent-body");

    if (list.length === 0) {
      cards.innerHTML = '<div class="appt-card"><p class="meta">No appointments yet.</p></div>';
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--gray-500);">No appointments yet</td></tr>';
    } else {
      list.forEach(function (a) {
        var card = document.createElement("div");
        card.className = "appt-card";
        card.innerHTML =
          '<div class="row"><span class="name">' + a.customer + '</span>' +
          '<span class="status status-' + a.status + '">' + a.status + '</span></div>' +
          '<div class="meta">' + a.service + '</div>' +
          '<div class="meta">' + a.date + ' · ' + a.time + '</div>';
        cards.appendChild(card);

        var tr = document.createElement("tr");
        tr.innerHTML =
          '<td>' + a.customer + '</td><td>' + a.service + '</td>' +
          '<td>' + a.date + ' · ' + a.time + '</td>' +
          '<td><span class="status status-' + a.status + '">' + a.status + '</span></td>';
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
