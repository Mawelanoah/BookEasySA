<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7C3AED" />
  <title>Profile | BeautyBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none" width="28" height="28"><path d="M20 4C20 4 12 12 12 20C12 26 15.5 30 20 32C24.5 30 28 26 28 20C28 12 20 4 20 4Z" fill="#7C3AED"/><circle cx="20" cy="20" r="4" fill="white"/></svg>
      BeautyBook
    </a>
  </header>

  <main class="main-content">
    <div style="padding:24px 16px;text-align:center;">
      <div style="width:80px;height:80px;border-radius:50%;background:var(--primary-soft);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2rem;">👤</div>
      <h1 style="font-size:1.3rem;font-weight:800;">Guest User</h1>
      <p style="color:var(--gray-500);font-size:0.9rem;">Sign in to manage bookings & favourites</p>
      <button class="btn btn-primary" style="margin-top:16px;width:100%;max-width:280px;" onclick="alert('Sign-in / Sign-up flow would open here (email, Google, or phone).')">Sign In / Sign Up</button>
    </div>

    <div style="background:white;margin:0 16px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);">
      <a href="bookings.html" style="display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--gray-100);gap:12px;">
        <span style="font-size:1.2rem;">📅</span>
        <span style="flex:1;font-weight:500;">My Bookings</span>
        <span style="color:var(--gray-400);">→</span>
      </a>
      <a href="#" style="display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--gray-100);gap:12px;">
        <span style="font-size:1.2rem;">❤️</span>
        <span style="flex:1;font-weight:500;">Favourites</span>
        <span style="color:var(--gray-400);">→</span>
      </a>
      <a href="dashboard.html" style="display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--gray-100);gap:12px;">
        <span style="font-size:1.2rem;">💼</span>
        <span style="flex:1;font-weight:500;">Business Dashboard</span>
        <span style="color:var(--gray-400);">→</span>
      </a>
      <a href="#" style="display:flex;align-items:center;padding:16px;gap:12px;">
        <span style="font-size:1.2rem;">⚙️</span>
        <span style="flex:1;font-weight:500;">Settings</span>
        <span style="color:var(--gray-400);">→</span>
      </a>
    </div>

    <div style="padding:24px 16px;text-align:center;">
      <p style="font-size:0.85rem;color:var(--gray-500);">BeautyBook · Made in South Africa 💜</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
    <a href="explore.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Explore</a>
    <a href="bookings.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bookings</a>
    <a href="profile.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>
</body>
</html>
