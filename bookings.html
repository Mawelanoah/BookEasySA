<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7C3AED" />
  <title>My Bookings | BeautyBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none" width="28" height="28"><path d="M20 4C20 4 12 12 12 20C12 26 15.5 30 20 32C24.5 30 28 26 28 20C28 12 20 4 20 4Z" fill="#7C3AED"/><circle cx="20" cy="20" r="4" fill="white"/></svg>
      BeautyBook
    </a>
  </header>

  <main class="main-content">
    <div style="padding:16px;">
      <h1 style="font-size:1.3rem;font-weight:800;margin-bottom:16px;">My Bookings</h1>
      <div class="tabs">
        <button class="tab active">Upcoming</button>
        <button class="tab">Past</button>
      </div>
    </div>

    <div class="booking-list">
      <div class="booking-item">
        <div class="info">
          <h4>Glow Beauty Studio</h4>
          <p>Gel Overlay · Fri 15 Nov · 14:30</p>
          <p style="font-size:0.8rem;color:var(--primary);margin-top:4px;">With Thandi</p>
        </div>
        <span class="status-badge status-confirmed">Confirmed</span>
      </div>
      <div class="booking-item">
        <div class="info">
          <h4>Royal Hair Studio</h4>
          <p>Silk Press · Sat 16 Nov · 10:00</p>
        </div>
        <span class="status-badge status-pending">Pending</span>
      </div>
    </div>

    <div style="padding:24px 16px;text-align:center;">
      <p style="color:var(--gray-500);margin-bottom:16px;">Looking for more beauty services?</p>
      <a href="explore.html" class="btn btn-primary">Explore Salons →</a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
    <a href="explore.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Explore</a>
    <a href="bookings.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bookings</a>
    <a href="profile.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>
</body>
</html>
