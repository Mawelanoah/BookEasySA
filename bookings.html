<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>My Bookings | BeautyBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20261124a" />
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 40 40" fill="none" width="26" height="26"><path d="M20 4C20 4 12 12 12 20C12 26 15.5 30 20 32C24.5 30 28 26 28 20C28 12 20 4 20 4Z" fill="#7C3AED"/><circle cx="20" cy="20" r="4" fill="white"/></svg>
      <span>BeautyBook</span>
    </a>
  </header>
  <main class="main-content">
    <section class="section">
      <div class="section-header"><h2>My bookings</h2></div>
      <p class="demo-note">Demo bookings saved on this device only.</p>
      <div id="list" class="booking-list"></div>
      <div id="empty" style="text-align:center;padding:32px 16px;color:var(--gray-500);" hidden>
        <p>No bookings yet.</p>
        <a href="explore.html" class="btn btn-primary btn-sm" style="max-width:200px;margin:12px auto 0;">Find a salon</a>
      </div>
    </section>
  </main>
  <nav class="bottom-nav">
    <a href="index.html"><svg fill="currentColor" viewBox="0 0 24 24" width="22" height="22"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
    <a href="explore.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Explore</a>
    <a href="bookings.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bookings</a>
    <a href="profile.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>
  <script>
    var list = [];
    try { list = JSON.parse(localStorage.getItem("bb_bookings") || "[]"); } catch (e) {}
    var el = document.getElementById("list");
    var empty = document.getElementById("empty");
    if (!list.length) { empty.hidden = false; }
    else {
      el.innerHTML = list.slice().reverse().map(function (b) {
        return '<div class="booking-item"><div class="info"><h4>' + (b.salonName || "Salon") + '</h4><p>' +
          (b.service && b.service.name ? b.service.name + " · " : "") + (b.date || "") + " " + (b.time || "") +
          '</p></div><span class="status-badge status-pending">' + (b.status || "pending") + '</span></div>';
      }).join("");
    }
  </script>
</body>
</html>
