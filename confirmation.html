<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request sent | BeautyBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20261124a" />
</head>
<body>
  <main class="main-content" style="padding:40px 20px;text-align:center;max-width:420px;margin:0 auto;">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.8rem;">OK</div>
    <h1 style="font-size:1.4rem;margin-bottom:8px;">Booking request submitted</h1>
    <p style="color:var(--gray-600);margin-bottom:12px;">This is a <strong>demo request</strong> stored on your device only. No real salon was notified and no payment was taken.</p>
    <p id="salonLine" style="font-size:0.9rem;color:var(--gray-500);margin-bottom:24px;"></p>
    <a href="bookings.html" class="btn btn-primary" style="margin-bottom:10px;">View my bookings</a>
    <a href="explore.html" class="btn btn-outline">Browse more</a>
  </main>
  <script>
    var p = new URLSearchParams(location.search);
    var s = p.get("salon");
    if (s) document.getElementById("salonLine").textContent = "Salon: " + s;
  </script>
</body>
</html>
