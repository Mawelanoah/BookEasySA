<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Favourites | BeautyBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20261124b" />
</head>
<body>
  <header class="app-header">
    <a href="profile.html" class="icon-btn" aria-label="Back">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <span style="font-weight:700;margin-left:8px;">Favourites</span>
  </header>
  <main class="main-content">
    <section class="section">
      <p class="demo-note">Saved on this device only.</p>
      <div class="salon-grid" id="list"></div>
      <div id="empty" style="text-align:center;padding:32px;color:var(--gray-500);" hidden>
        <p>No favourites yet.</p>
        <a href="explore.html" class="btn btn-primary btn-sm" style="max-width:200px;margin:12px auto 0;">Explore salons</a>
      </div>
    </section>
  </main>
  <nav class="bottom-nav">
    <a href="index.html"><svg fill="currentColor" viewBox="0 0 24 24" width="22" height="22"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
    <a href="explore.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Explore</a>
    <a href="bookings.html"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bookings</a>
    <a href="profile.html" class="active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
  </nav>
  <script src="js/data.js"></script>
  <script>
    var ids = BB.getFavs();
    var list = ids.map(function (id) { return BB.getById(id); }).filter(Boolean);
    var el = document.getElementById("list");
    if (!list.length) document.getElementById("empty").hidden = false;
    else {
      el.innerHTML = list.map(function (b) {
        return '<article class="salon-card"><div class="salon-card-img"><img src="' + b.image + '" alt="" loading="lazy" /></div><div class="salon-card-body"><h3>' + b.name + '</h3><div class="salon-meta">' + b.categoryLabel + ' · ' + b.location + '</div><div class="price">From R' + b.priceFrom + '</div><div class="card-actions"><a href="salon.html?id=' + b.id + '" class="btn btn-outline btn-sm">View</a><a href="booking.html?salon=' + b.id + '" class="btn btn-primary btn-sm">Book</a></div></div></article>';
      }).join("");
    }
  </script>
</body>
</html>
