<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Register your business | BeautyBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20261124b" />
</head>
<body>
  <header class="app-header">
    <a href="profile.html" class="icon-btn" aria-label="Back">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <span style="font-weight:700;margin-left:8px;">Register business</span>
  </header>
  <main class="main-content" style="padding:20px 16px;max-width:480px;margin:0 auto;">
    <p class="demo-note" style="margin-bottom:14px;">Demo registration only — saved on this device. Not published to a live directory.</p>
    <form id="form">
      <div class="form-group"><label>Business name *</label><input type="text" id="bizName" class="form-control" required /></div>
      <div class="form-group"><label>Category *</label>
        <select id="category" class="form-control" required>
          <option value="">Select…</option>
          <option value="nails">Nail Salons</option>
          <option value="hair">Hair Salons</option>
          <option value="barber">Barbershops</option>
          <option value="lashes">Lashes and Brows</option>
          <option value="makeup">Makeup Artists</option>
          <option value="skincare">Facials and Skincare</option>
          <option value="massage">Massage and Spas</option>
          <option value="waxing">Waxing</option>
          <option value="tattoo">Tattoo Studios</option>
          <option value="piercing">Piercing Studios</option>
        </select>
      </div>
      <div class="form-group"><label>Suburb / city *</label><input type="text" id="location" class="form-control" required placeholder="e.g. Hatfield, Pretoria" /></div>
      <div class="form-group"><label>Owner name *</label><input type="text" id="ownerName" class="form-control" required /></div>
      <div class="form-group"><label>Phone *</label><input type="tel" id="phone" class="form-control" required /></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" class="form-control" /></div>
      <div class="form-group"><label>Short description</label><textarea id="desc" class="form-control" rows="3"></textarea></div>
      <button type="submit" class="btn btn-primary">Save demo profile</button>
    </form>
    <p style="margin-top:14px;font-size:0.85rem;color:var(--gray-500);">Already registered on this device? <a href="dashboard.html" style="color:var(--primary);font-weight:600;">Open dashboard</a></p>
  </main>
  <script src="js/data.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      BB.setOwner({
        bizName: document.getElementById("bizName").value.trim(),
        category: document.getElementById("category").value,
        location: document.getElementById("location").value.trim(),
        ownerName: document.getElementById("ownerName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        description: document.getElementById("desc").value.trim(),
        demo: true,
        createdAt: new Date().toISOString()
      });
      alert("Demo business profile saved on this device.");
      location.href = "dashboard.html";
    });
  </script>
</body>
</html>
